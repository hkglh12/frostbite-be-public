server{
	listen 80;
	server_name localhost 127.0.0.1;
	root /data/dist;
	#index index.html;

	location /frostbite/ {
		#alias /data/dist;
		index index.html;
		try_files $uri $uri/ /frostbite/index.html;
	}

	location = /{
		#try_files $uri $uri/ /frostbite/index.html;
		return 302 /frostbite/;
	
	}
}
