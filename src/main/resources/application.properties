spring.application.name=frostbite
server.port=9410

spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:postgresql://localhost:9413/frostbite
spring.datasource.username=frostbite
spring.datasource.password=${spring.datasource.defaultpassword}
spring.data.redis.host=localhost
spring.data.redis.port=6479

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=false

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name: XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name: X-XSRF-TOKEN

spring.session.store-type=redis

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB

# ??? ??? (?? ???? ??)
# springdoc.packages-to-scan=com.example.yourpackage

mybatis.mapper-locations=classpath:mybatis/xml/*.xml
mybatis.type-aliases-package=com.uruz.frostbite.domain,com.uruz.frostbite.dto,com.uruz.frostbite.internalvo
mybatis.type-handlers-package=com.uruz.frostbite.typehandler
logging.level.root = INFO

frostbite.secret.encryption.algorhitm=AES256
frostbite.secret.encryption.master-key-format=Base64
frostbite.secret.encryption.master-key=${frostbite.secret.encryption.master-key-base}
frostbite.multipart.temp.ttl = 2d
#---
spring.config.activate.on-profile=DEV-OCI
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:postgresql://localhost:9413/frostbite
spring.datasource.username=frostbite
spring.datasource.password=${spring.datasource.ocipassword}
spring.data.redis.host=localhost
spring.data.redis.port=6479

spring.servlet.multipart.location=${frostbite.servlet.multipart.oci.location}
frostbite.multipart.temp.location=${frostbite.multipart.temp.oci.location}
#---
spring.config.activate.on-profile=LOCAL-DEV-WIN
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:postgresql://localhost:9413/frostbite
spring.datasource.username=frostbite
spring.datasource.password=${spring.datasource.localpassword}
spring.data.redis.host=localhost
spring.data.redis.port=6479

# JAVA.IO.TEMPDIR
spring.servlet.multipart.location= ${frostbite.servlet.multipart.local.location}
# JAVA>IO.TEMPDIR과 별개로 app multipart tempdir
frostbite.multipart.temp.location=${frostbite.multipart.temp.local.location}
